name: Verify Godot prototype
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and Web templates
        run: |
          curl -fL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/web*' -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          cp /tmp/templates/templates/web* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Test server rules
        run: godot --headless --path . --script tests/test_world.gd
      - name: Export browser client
        run: ./tools/export_web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zentura-web
          path: build/web
